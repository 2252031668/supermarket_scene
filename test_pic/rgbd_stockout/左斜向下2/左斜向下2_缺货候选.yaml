limitations:
- The shelf-front plane must be visible enough for a stable 3D fit.
- Each decision compares the closest RGB-D product instance with a robust normal-front
  baseline from the same shelf.
- Every shelf front is fitted independently; normals are not shared.
- A clipped level is skipped when its own shelf front is not visible; another level
  plane is never reused for it.
- Errors in closest-product segmentation can affect the group status.
