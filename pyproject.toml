[project]
name = "supermarket-scene-manager"
version = "0.1.0"
description = "Local API and Three.js management interface for shelf_inventory.db"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10.0",
    "huggingface-hub>=1.26.0",
    "mujoco>=3.0",
    "numpy>=2.2.6",
    "opencv-python>=4.6.0",
    "pillow>=11.0.0",
    "pyyaml>=6.0.2",
    "socksio>=1.0.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "ultralytics>=8.4.113",
    "volcengine-python-sdk[ark]",
]

[tool.uv]
package = false
